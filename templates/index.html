<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador de Franquicias</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav>
    <a href="/">Inicio</a>
    <a href="/historial">Historial</a>
    <a href="/EstadoSis">Estado del Sistema</a>
</nav>

<div class="container">
    <div class="card">

        <h1>Clasificador de Franquicias</h1>

        <!-- ── Feed de cámara en vivo (OpenCV → MJPEG) ── -->
        <div class="camera-wrapper">
            <img id="camFeed"
                 src="/video_feed"
                 alt="Feed de cámara en vivo">
            <div class="camera-label">Cámara en vivo</div>
        </div>

        <p class="desc">
            Sistema IoT para clasificación automática de imágenes mediante Inteligencia Artificial.
            Captura un frame de la cámara o sube una imagen para clasificar.
        </p>

        <!-- ── Botón principal: captura frame y clasifica ── -->
        <button id="btnCapturar" class="btn-capturar" onclick="capturarCamara()">
            Capturar y Clasificar
        </button>

        <!-- ── Resultado de la clasificación ── -->
        <div id="resultado" class="resultado"></div>

        <!-- ── Separador ── -->
        <div class="separador"><span>— o subir imagen manualmente —</span></div>

        <!-- ── Formulario de subida manual (funcionalidad original) ── -->
        <form action="/simular" method="POST" enctype="multipart/form-data">
            <input type="file" name="imagen" accept=".jpg,.jpeg,.png" required>
            <br><br>
            <button type="submit" class="btn-archivo">Clasificar desde archivo</button>
        </form>

    </div>
</div>

<script>
async function capturarCamara() {
    const btn = document.getElementById('btnCapturar');
    const res = document.getElementById('resultado');

    // Estado de carga
    btn.disabled = true;
    btn.textContent = ' Clasificando…';
    res.className = 'resultado';
    res.innerHTML = '';

    try {
        const response = await fetch('/capturar', { method: 'POST' });
        const data = await response.json();

        if (data.error) {
            res.className = 'resultado resultado--error';
            res.innerHTML = `<strong>Error:</strong> ${data.error}`;
        } else {
            res.className = 'resultado resultado--ok';
            res.innerHTML = `
                ✅ <strong>Clasificación completada</strong><br>
                Categoría: <em>${data.categoria}</em><br>
                Confianza: <em>${data.confianza}%</em>
            `;
        }
    } catch (err) {
        res.className = 'resultado resultado--error';
        res.innerHTML = 'Error de conexión con el servidor';
    } finally {
        btn.disabled = false;
        btn.textContent = 'Capturar y Clasificar';
    }
}
</script>

</body>
</html>
