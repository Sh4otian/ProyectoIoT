services:

  # ── Broker MQTT Mosquitto ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # ── Aplicación Flask + IA + OpenCV ────────────────────────────────────────
  app:
    build: .
    container_name: iot-flask
    ports:
      - "5000:5000"
    environment:
      - MQTT_HOST=mosquitto        # nombre del servicio en la red de Compose
    volumes:
      - uploads_data:/app/uploads  # imágenes capturadas persisten entre reinicios
      - bd_data:/app/BD            # historial SQLite persiste entre reinicios
    devices:
      # Cámara USB o integrada del host → contenedor
      # Si tienes más cámaras agrega /dev/video1:/dev/video1, etc.
      # Si no hay cámara, comenta estas líneas; la app muestra un placeholder.
      - /dev/video0:/dev/video0
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  uploads_data:
  bd_data:
