services:

  # Broker MQTT Mosquitto
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  # Aplicación Flask + IA
  app:
    build: .
    container_name: iot-flask
    ports:
      - "5000:5000"
    environment:
      - MQTT_HOST=mosquitto        # nombre del servicio en la red de Compose
    volumes:
      - uploads_data:/app/uploads  # imágenes subidas persisten entre reinicios
      - bd_data:/app/BD            # historial SQLite persiste entre reinicios
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  uploads_data:
  bd_data:
